{% extends "mailing/base.html" %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-12">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p}}
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Войти
                    </button>
                    <a href="{% url 'users:register' %}" class="btn btn-secondary">Регистрация</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
